<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terav brand directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --ground:#0e0f12; --surface:#16181c; --surface-2:#20232a; --ink:#d6d9de; --strong:#f4f5f7; --muted:#93989f; --line:#5f6570; --line-soft:#24272f; }
  * { box-sizing: border-box; }
  body { margin:0; background:#08090b; color:var(--ink); font-family:Inter, system-ui, sans-serif; }
  .dir { width:1200px; padding:40px; margin:0 auto 40px; background:var(--ground); border:1px solid var(--line-soft); }
  h1 { font-size:32px; font-weight:700; color:var(--strong); margin:0 0 4px; letter-spacing:-0.01em; }
  .thesis { color:var(--muted); font-size:16px; margin:0 0 28px; max-width:820px; line-height:1.5; }
  .eyebrow { font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; }
  .row { display:flex; gap:28px; align-items:flex-end; flex-wrap:wrap; margin-bottom:32px; }
  .cell { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .cap { font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--muted); }
  .ios { width:120px; height:120px; border-radius:27px; overflow:hidden; }
  .circle { width:96px; height:96px; border-radius:50%; overflow:hidden; }
  .squircle { width:96px; height:96px; border-radius:30px; overflow:hidden; }
  .safe { position:relative; width:128px; height:128px; }
  .safe::after { content:""; position:absolute; inset:12.8px; border-radius:50%; border:1px dashed #ff4d8d; }
  canvas.px { image-rendering: pixelated; }
  .tab { display:flex; align-items:center; gap:8px; background:#2a2d33; border-radius:8px 8px 0 0; padding:8px 14px; width:220px; font-size:13px; color:#e6e6e6; }
  .tab.light { background:#e9ebee; color:#222; }
  .bars { display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:32px; }
  .bar { background:var(--ground); border:1px solid var(--line-soft); border-radius:12px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; }
  .bar.light { background:#f6f3ee; border-color:#e4ded4; }
  .bar .nav { font-size:13px; color:var(--muted); display:flex; gap:16px; }
  .phone { width:195px; height:422px; border-radius:30px; border:6px solid #2a2d33; overflow:hidden; position:relative; }
  .phone-inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  .swatches { display:flex; gap:10px; flex-wrap:wrap; }
  .sw { width:92px; }
  .sw div { height:56px; border-radius:8px; border:1px solid var(--line-soft); }
  .sw span { display:block; font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--muted); margin-top:5px; line-height:1.35; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:28px; }
  .card { background:var(--surface); border:1px solid var(--line-soft); border-radius:12px; padding:16px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; height:48px; padding:0 22px; border-radius:8px; font-weight:600; font-size:16px; color:#14110d; }
  .btn2 { display:inline-flex; align-items:center; height:48px; padding:0 20px; border-radius:8px; font-weight:600; font-size:16px; color:var(--strong); border:1px solid var(--line); margin-left:10px; }
  .ad { width:300px; height:300px; border-radius:6px; overflow:hidden; position:relative; padding:22px; display:flex; flex-direction:column; justify-content:space-between; }
  .notes { font-size:14px; line-height:1.55; color:var(--ink); }
  .notes b { color:var(--strong); }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---------------------------------------------------------------- marks
// Each mark is the glyph only (no background), drawn on a 512 grid so the
// maskable safe zone (centre circle r=204.8) can be checked directly.
const MARKS = {
  A: {
    name: "A · Chisel",
    thesis: "Evolve what exists. The bronze→teal chisel stroke from the landing hero becomes the whole identity: a T cut from two bevelled strokes, the same stroke under the wordmark and the H1. Gradient is the signature; flat bronze below 48px.",
    bronze: "#d09a68", bronzeHi: "#e8b988", teal: "#7fc4d0",
    glyph: (s) => `
      <defs><linearGradient id="gA${s}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e8b988"/><stop offset=".55" stop-color="#d09a68"/><stop offset="1" stop-color="#7fc4d0"/></linearGradient></defs>
      <path d="M118 150 L402 128 L394 202 L110 224 Z" fill="${s==='flat'?'#d09a68':`url(#gA${s})`}"/>
      <path d="M222 214 L294 208 L294 404 L222 362 Z" fill="${s==='flat'?'#d09a68':`url(#gA${s})`}"/>`,
    small: 'flat',
    word: (light) => `<div style="display:flex;align-items:center;gap:10px">
        <svg width="18" height="10" viewBox="0 0 18 10"><defs><linearGradient id="wA${light?1:0}" x1="0" x2="1"><stop offset="0" stop-color="#e8b988"/><stop offset=".55" stop-color="#d09a68"/><stop offset="1" stop-color="#7fc4d0"/></linearGradient></defs><path d="M2 3 L18 1 L16 8 L0 10 Z" fill="url(#wA${light?1:0})"/></svg>
        <span style="font-weight:600;font-size:15px;letter-spacing:.22em;color:${light?'#14110d':'#f4f5f7'}">TERAV</span></div>`,
    wordLg: `<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><span style="font-weight:600;font-size:20px;letter-spacing:.24em;color:#f4f5f7">TERAV</span>
        <svg width="70" height="8" viewBox="0 0 70 8"><defs><linearGradient id="wAl" x1="0" x2="1"><stop offset="0" stop-color="#e8b988"/><stop offset=".55" stop-color="#d09a68"/><stop offset="1" stop-color="#7fc4d0"/></linearGradient></defs><path d="M2 5 L70 1 L68 5 L0 8 Z" fill="url(#wAl)"/></svg></div>`,
    btn: "linear-gradient(180deg,#e8b988,#d09a68)",
    palette: [["bronze","#d09a68"],["bronze-hi","#e8b988"],["teal","#7fc4d0"],["identity gradient","linear-gradient(135deg,#e8b988,#d09a68 55%,#7fc4d0)"]],
    rules: "<b>Colour:</b> bronze primary, teal secondary, the 3-stop gradient only on identity (icon, wordmark stroke, one hero word). <b>Type:</b> Inter; wordmark caps tracked .22em; eyebrows mono caps. <b>Icons:</b> lucide at 1.75 stroke, unchanged.",
  },
  B: {
    name: "B · Lettermark",
    thesis: "Flat and wordmark-led, like Whoop and Hevy. A heavy lowercase t with the existing bronze pip set as a full stop. One accent only: bronze. Teal drops back to charts and info. No gradients anywhere, so the icon, an ad and a screenshot all render the same.",
    bronze: "#c89666", bronzeHi: "#e2b686", teal: "#79b8c4",
    glyph: () => `
      <path d="M196 116 H264 V316 Q264 344 292 344 H316 V404 H284 Q196 404 196 322 Z" fill="#f4f5f7"/>
      <rect x="148" y="194" width="176" height="60" fill="#f4f5f7"/>
      <circle cx="372" cy="374" r="30" fill="#c89666"/>`,
    small: 'same',
    word: (light) => `<div style="display:flex;align-items:baseline;gap:1px"><span style="font-weight:800;font-size:22px;letter-spacing:-0.04em;color:${light?'#14110d':'#f4f5f7'}">terav</span><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#c89666;margin-left:2px"></span></div>`,
    wordLg: `<div style="display:flex;align-items:baseline"><span style="font-weight:800;font-size:30px;letter-spacing:-0.04em;color:#f4f5f7">terav</span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#c89666;margin-left:3px"></span></div>`,
    btn: "#c89666",
    palette: [["bronze","#c89666"],["bronze-hover","#d9a97c"],["teal (data only)","#79b8c4"],["no gradient","#16181c"]],
    rules: "<b>Colour:</b> bronze is the only accent (brand, primary button, Accept). Teal only in charts and info chips. No gradients. <b>Type:</b> Inter; wordmark lowercase 800, −0.04em; headings tighter (−0.02em). <b>Icons:</b> lucide at 1.75 stroke, unchanged.",
  },
  C: {
    name: "C · Edge",
    thesis: "A new symbol: a rising wedge with a honed teal edge. It reads as progress and as an edge being sharpened, without spelling anything out. Bronze and teal are both flat, used as a pair. The wordmark is title case beside the symbol.",
    bronze: "#c89666", bronzeHi: "#e2b686", teal: "#79b8c4",
    glyph: () => `
      <path d="M108 372 L404 164 L404 252 L232 372 Z" fill="#c89666"/>
      <path d="M108 344 L404 136 L404 152 L108 360 Z" fill="#79b8c4"/>`,
    small: 'same',
    word: (light) => `<div style="display:flex;align-items:center;gap:8px"><svg width="22" height="22" viewBox="96 120 320 264"><path d="M108 372 L404 164 L404 252 L232 372 Z" fill="#c89666"/><path d="M108 344 L404 136 L404 152 L108 360 Z" fill="#79b8c4"/></svg><span style="font-weight:600;font-size:19px;letter-spacing:-0.01em;color:${light?'#14110d':'#f4f5f7'}">Terav</span></div>`,
    wordLg: `<span style="font-weight:600;font-size:24px;letter-spacing:-0.01em;color:#f4f5f7">Terav</span>`,
    btn: "#c89666",
    palette: [["bronze","#c89666"],["bronze-hover","#d9a97c"],["teal (pair)","#79b8c4"],["flat pair","linear-gradient(90deg,#c89666 50%,#79b8c4 50%)"]],
    rules: "<b>Colour:</b> bronze plus teal as a flat pair; bronze stays the only CTA colour. No gradients. <b>Type:</b> Inter; wordmark title case 600; headings −0.01em. <b>Icons:</b> lucide at 1.75 stroke; the symbol sets the angle for any custom glyphs.",
  },
};

const svg = (key, size, opts = {}) => {
  const m = MARKS[key];
  const variant = opts.flat && m.small === 'flat' ? 'flat' : (opts.id || size);
  const bg = opts.transparent ? '' : `<rect width="512" height="512" fill="#0e0f12"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">${bg}${m.glyph(variant)}</svg>`;
};

function section(key) {
  const m = MARKS[key];
  return `<section class="dir" id="dir-${key}">
    <h1>${m.name}</h1><p class="thesis">${m.thesis}</p>

    <p class="eyebrow">App icons, real display sizes</p>
    <div class="row">
      <div class="cell"><div class="ios">${svg(key,120,{id:'ios'+key})}</div><span class="cap">iOS 180 (rounded by iOS)</span></div>
      <div class="cell"><div class="circle">${svg(key,96,{id:'c'+key})}</div><span class="cap">Android circle mask</span></div>
      <div class="cell"><div class="squircle">${svg(key,96,{id:'q'+key})}</div><span class="cap">Android squircle</span></div>
      <div class="cell"><div class="safe">${svg(key,128,{id:'s'+key})}</div><span class="cap">maskable safe zone</span></div>
      <div class="cell"><canvas class="px" data-key="${key}" data-n="32" width="32" height="32" style="width:96px;height:96px"></canvas><span class="cap">32px ×3</span></div>
      <div class="cell"><canvas class="px" data-key="${key}" data-n="16" width="16" height="16" style="width:96px;height:96px"></canvas><span class="cap">16px ×6</span></div>
      <div class="cell"><div class="tab"><canvas data-key="${key}" data-n="16" width="16" height="16"></canvas>Terav · Today</div><div class="tab light"><canvas data-key="${key}" data-n="16" width="16" height="16"></canvas>Terav · Today</div><span class="cap">browser tabs</span></div>
    </div>

    <p class="eyebrow">Wordmark: app header, landing nav, light (ads / press)</p>
    <div class="bars">
      <div class="bar">${m.word(false)}<div class="nav"><span>Today</span></div></div>
      <div class="bar">${m.word(false)}<div class="nav"><span>Programs</span><span>Evidence</span><span style="color:#14110d;background:${m.btn};padding:6px 12px;border-radius:8px;font-weight:600">Start free</span></div></div>
      <div class="bar light">${m.word(true)}<div class="nav" style="color:#6b6458"><span>terav.fit</span></div></div>
    </div>

    <div class="grid2">
      <div>
        <p class="eyebrow">PWA splash · ad tile</p>
        <div class="row" style="align-items:flex-start">
          <div class="phone" style="background:#0e0f12"><div class="phone-inner">${svg(key,88,{transparent:true,id:'sp'+key})}${m.wordLg}</div></div>
          <div class="ad" style="background:#0e0f12;border:1px solid #24272f">
            <div>${m.word(false)}</div>
            <div><div style="font-size:30px;font-weight:700;line-height:1.08;color:#f4f5f7;letter-spacing:-0.02em">Improve your<br><span style="color:${m.bronze}">weakest area.</span><br>Keep your training.</div>
            <div style="margin-top:14px"><span class="btn" style="background:${m.btn};height:36px;font-size:14px;padding:0 14px">Start free</span></div></div>
          </div>
        </div>
      </div>
      <div>
        <p class="eyebrow">Accent palette (neutrals shared by all directions)</p>
        <div class="swatches" style="margin-bottom:20px">
          ${m.palette.map(([n,v])=>`<div class="sw"><div style="background:${v}"></div><span>${n}<br>${v.startsWith('#')?v:''}</span></div>`).join('')}
        </div>
        <p class="eyebrow">Type scale + one card + one button</p>
        <div class="card">
          <div class="eyebrow" style="margin-bottom:6px">Week 3 of 8</div>
          <div style="font-size:32px;font-weight:700;color:#f4f5f7;letter-spacing:${key==='B'?'-0.02em':'-0.01em'};line-height:1.15">First strict pull-up</div>
          <div style="font-size:20px;font-weight:600;color:#f4f5f7;margin-top:8px">Today: negatives, 4 × 3</div>
          <div style="font-size:16px;color:#d6d9de;margin-top:6px;line-height:1.5">Slower lowering this week, because your last two sessions hit every rep.</div>
          <div style="font-size:13px;color:#93989f;margin-top:4px">Because: your log, sessions 5–6</div>
          <div style="margin-top:14px"><span class="btn" style="background:${m.btn}">Start session</span><span class="btn2">Not now</span></div>
        </div>
      </div>
    </div>
    <p class="notes" style="margin-top:22px">${m.rules}</p>
  </section>`;
}

document.getElementById('root').innerHTML = ['A','B','C'].map(section).join('');

// Rasterise favicons honestly: draw the SVG into a 16/32px canvas, then show
// the canvas scaled with pixelated rendering — what a browser tab really gets.
for (const c of document.querySelectorAll('canvas[data-key]')) {
  const key = c.dataset.key, n = +c.dataset.n;
  const img = new Image();
  img.onload = () => c.getContext('2d').drawImage(img, 0, 0, n, n);
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg(key, n, { flat: n <= 48, id: 'px' + key + n }));
}
</script>
</body>
</html>
