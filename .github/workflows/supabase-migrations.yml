name: Apply Supabase migrations

# Runs `supabase db push` against the production project on every commit
# to main that touches supabase/migrations/*.sql. Also runnable manually
# from the Actions tab (workflow_dispatch) as a break-glass path when
# a migration needs to be applied outside the normal push flow.
#
# Supabase CLI handles the tracking table (`supabase_migrations.schema_migrations`)
# automatically — migrations already applied are silently skipped. Idempotent.
#
# Required GitHub secrets (set at https://github.com/msellin/program/settings/secrets/actions):
#   SUPABASE_ACCESS_TOKEN — personal access token from
#     https://supabase.com/dashboard/account/tokens (scope: all)
#   SUPABASE_PROJECT_ID   — the project ref from Project Settings → General
#                           (looks like: abcdefgh12345678). NOT the org ID.
#   SUPABASE_DB_PASSWORD  — the database password from Project Settings → Database
#                           → Connection string. Used by `db push` to run the
#                           migrations via the direct Postgres connection.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**.sql'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

      - name: Push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # `db push` runs pending migrations in order. Uses the tracking
          # table under the hood so already-applied migrations are skipped.
          # --include-all: without this the CLI can prompt interactively for
          # confirmation on migrations older than the last-known applied
          # timestamp; --include-all makes CI hands-off.
          supabase db push --include-all

      - name: Summary
        run: |
          echo "✅ Supabase migrations applied to project ${{ secrets.SUPABASE_PROJECT_ID }}"
